<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-body-tertiary">
  <main class="container py-4" style="max-width: 640px">
    <h1 class="h3 mb-3">Student registration</h1>
    <form id="register" class="card card-body" novalidate>
      <div class="mb-3">
        <label for="fullName" class="form-label">Full name</label>
        <input id="fullName" class="form-control" autocomplete="name" aria-describedby="fullNameError">
        <div id="fullNameError" class="invalid-feedback"></div>
      </div>
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label for="email" class="form-label">Email</label>
          <input id="email" type="email" class="form-control" autocomplete="email" aria-describedby="emailError">
          <div id="emailError" class="invalid-feedback"></div>
        </div>
        <div class="col-md-6">
          <label for="phone" class="form-label">Mobile</label>
          <input id="phone" type="tel" class="form-control" placeholder="0300-1234567" aria-describedby="phoneError">
          <div id="phoneError" class="invalid-feedback"></div>
        </div>
      </div>
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label for="password" class="form-label">Password</label>
          <input id="password" type="password" class="form-control" autocomplete="new-password" aria-describedby="passwordError">
          <div class="progress mt-1" style="height: 6px" role="progressbar" aria-label="Password strength" aria-valuemin="0" aria-valuemax="100">
            <div id="strength" class="progress-bar" style="width: 0%"></div></div>
          <div id="passwordError" class="invalid-feedback"></div>
        </div>
        <div class="col-md-6">
          <label for="confirm" class="form-label">Confirm password</label>
          <input id="confirm" type="password" class="form-control" autocomplete="new-password" aria-describedby="confirmError">
          <div id="confirmError" class="invalid-feedback"></div>
        </div>
      </div>
      <div class="mb-3">
        <label for="programme" class="form-label">Programme</label>
        <select id="programme" class="form-select" aria-describedby="programmeError">
          <option value="">Choose…</option><option>BSCS</option><option>BSSE</option><option>BBA</option>
        </select>
        <div id="programmeError" class="invalid-feedback"></div>
      </div>
      <div class="form-check mb-3">
        <input id="terms" type="checkbox" class="form-check-input" aria-describedby="termsError">
        <label for="terms" class="form-check-label">I accept the terms</label>
        <div id="termsError" class="invalid-feedback"></div>
      </div>
      <button class="btn btn-primary">Create account</button>
    </form>
    <div id="success" class="alert alert-success d-none" role="status"></div>
  </main>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
          integrity="sha384-1H217gwSVyLSIfaLxHbE7dRb3v4mYCKbpQvzx0cegeju1MVsGrX5xXxAvs/HgeFs" crossorigin="anonymous"></script>
  <script src="session-06_validation.js"></script>
</body>
</html>
