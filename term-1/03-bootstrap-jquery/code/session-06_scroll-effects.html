<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scroll effects</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <style>
    section { min-height: 80vh; padding-top: 5rem; }
    #toTop { position: fixed; right: 1rem; bottom: 1rem; display: none; }
  </style>
</head>
<!-- ScrollSpy: Bootstrap watches the sections and highlights the matching nav link -->
<body data-bs-spy="scroll" data-bs-target="#spyNav" data-bs-offset="80" tabindex="0">
  <nav id="spyNav" class="navbar navbar-expand bg-dark fixed-top" data-bs-theme="dark">
    <div class="container">
      <span class="navbar-brand">Scroll demo</span>
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="#one">One</a></li>
        <li class="nav-item"><a class="nav-link" href="#stats">Stats</a></li>
        <li class="nav-item"><a class="nav-link" href="#three">Three</a></li>
      </ul>
    </div>
  </nav>
  <section id="one" class="container"><h1>Section one</h1><p>Scroll down…</p></section>
  <section id="stats" class="container bg-body-tertiary">
    <h2>Our numbers</h2>
    <div class="row text-center">
      <div class="col-6 col-md-3"><p class="display-5 fw-bold counter" data-target="12500">0</p><p>Parcels delivered</p></div>
      <div class="col-6 col-md-3"><p class="display-5 fw-bold counter" data-target="35">0</p><p>Cities</p></div>
      <div class="col-6 col-md-3"><p class="display-5 fw-bold counter" data-target="98">0</p><p>% on time</p></div>
      <div class="col-6 col-md-3"><p class="display-5 fw-bold counter" data-target="240">0</p><p>Riders</p></div>
    </div>
  </section>
  <section id="three" class="container"><h2>Section three</h2></section>
  <button id="toTop" class="btn btn-warning" aria-label="Back to top">↑</button>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
          integrity="sha384-1H217gwSVyLSIfaLxHbE7dRb3v4mYCKbpQvzx0cegeju1MVsGrX5xXxAvs/HgeFs" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script>
    $(function () {
      const navHeight = $('#spyNav').outerHeight();

      // Smooth scroll with an offset so headings are not hidden under the fixed navbar
      $('#spyNav').on('click', 'a.nav-link', function (e) {
        e.preventDefault();
        const top = $($(this).attr('href')).offset().top - navHeight;
        $('html, body').stop().animate({ scrollTop: top }, 500);
      });

      // Count-up: runs once, the first time the stats section enters the screen
      let counted = false;
      function runCounters() {
        $('.counter').each(function () {
          const $c = $(this);
          $({ n: 0 }).animate({ n: $c.data('target') }, {
            duration: 1500,
            step: now => $c.text(Math.floor(now).toLocaleString('en-US')),
            complete: () => $c.text(Number($c.data('target')).toLocaleString('en-US')),
          });
        });
      }

      // One light scroll handler: back-to-top visibility + trigger counters once
      $(window).on('scroll', function () {
        const y = $(this).scrollTop();
        $('#toTop').toggle(y > 400);
        if (!counted && y + $(window).height() > $('#stats').offset().top + 100) {
          counted = true;
          runCounters();
        }
      });

      $('#toTop').on('click', () => $('html, body').animate({ scrollTop: 0 }, 400));
    });
  </script>
</body>
</html>
