<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio gallery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.1/themes/base/jquery-ui.css">
  <style> .thumb { cursor: zoom-in; } #lightbox img { max-width: 100%; } </style>
</head>
<body>
  <main class="container py-4">
    <h1 class="h3">Portfolio</h1>
    <div id="cats" class="btn-group mb-3" role="group" aria-label="Filter projects">
      <button class="btn btn-outline-dark active" data-cat="all">All</button>
      <button class="btn btn-outline-dark" data-cat="web">Web</button>
      <button class="btn btn-outline-dark" data-cat="mobile">Mobile</button>
      <button class="btn btn-outline-dark" data-cat="design">Design</button>
    </div>
    <div id="grid" class="row row-cols-2 row-cols-md-3 g-3">
      <div class="col item" data-cat="web"><img class="img-fluid rounded thumb" src="https://picsum.photos/seed/g1/400/300" alt="Clinic booking website"></div>
      <div class="col item" data-cat="mobile"><img class="img-fluid rounded thumb" src="https://picsum.photos/seed/g2/400/300" alt="Rickshaw tracking app"></div>
      <div class="col item" data-cat="design"><img class="img-fluid rounded thumb" src="https://picsum.photos/seed/g3/400/300" alt="Bakery logo design"></div>
      <div class="col item" data-cat="web"><img class="img-fluid rounded thumb" src="https://picsum.photos/seed/g4/400/300" alt="School results portal"></div>
      <div class="col item" data-cat="mobile"><img class="img-fluid rounded thumb" src="https://picsum.photos/seed/g5/400/300" alt="Prayer times app"></div>
      <div class="col item" data-cat="design"><img class="img-fluid rounded thumb" src="https://picsum.photos/seed/g6/400/300" alt="Event poster"></div>
      <div class="col item" data-cat="web"><img class="img-fluid rounded thumb" src="https://picsum.photos/seed/g7/400/300" alt="Online bookstore"></div>
      <div class="col item" data-cat="mobile"><img class="img-fluid rounded thumb" src="https://picsum.photos/seed/g8/400/300" alt="Expense tracker app"></div>
      <div class="col item" data-cat="design"><img class="img-fluid rounded thumb" src="https://picsum.photos/seed/g9/400/300" alt="Brand style guide"></div>
    </div>
  </main>
  <div id="lightbox" title="Project"><img src="" alt=""><p class="caption mt-2 mb-0"></p></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
          integrity="sha384-1H217gwSVyLSIfaLxHbE7dRb3v4mYCKbpQvzx0cegeju1MVsGrX5xXxAvs/HgeFs" crossorigin="anonymous"></script>
  <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.min.js" crossorigin="anonymous"></script>
  <script>
    $(function () {
      let $current = $();                                    // the .item currently shown in the lightbox

      // ---- 1. Category filter with fade effects ----
      $('#cats').on('click', 'button', function () {
        const cat = $(this).data('cat');
        $(this).addClass('active').siblings().removeClass('active');
        $('#grid .item').each(function () {
          const match = cat === 'all' || $(this).data('cat') === cat;
          match ? $(this).stop(true).fadeIn(250) : $(this).stop(true).fadeOut(250);
        });
      });

      // ---- 2. Lightbox: show one item inside the dialog ----
      function show($item) {
        $current = $item;
        const $img = $item.find('img');
        $('#lightbox img').attr({ src: $img.attr('src').replace('400/300', '1200/900'), alt: $img.attr('alt') });
        $('#lightbox .caption').text($img.attr('alt'));
        if ($.fn.dialog) $('#lightbox').dialog('option', 'title', $img.attr('alt'));
      }

      // Visible items only, so Previous/Next respect the active filter
      const visibleItems = () => $('#grid .item').filter(function () { return $(this).css('display') !== 'none'; });

      function step(dir) {
        const $items = visibleItems();
        let i = $items.index($current) + dir;
        if (i >= $items.length) i = 0;                      // wrap around
        if (i < 0) i = $items.length - 1;
        show($items.eq(i));
      }

      if ($.fn.dialog) {
        $('#lightbox').dialog({
          autoOpen: false, modal: true, width: Math.min(900, $(window).width() - 20),
          buttons: { '◀ Previous': () => step(-1), 'Next ▶': () => step(1) }
        });
      }

      $('#grid').on('click', '.thumb', function () {
        show($(this).closest('.item'));                     // traverse up to the item
        if ($.fn.dialog) $('#lightbox').dialog('open');
      });

      // Expose step() for keyboard arrows (and the automated test)
      $(document).on('keydown', e => {
        if (e.key === 'ArrowRight') step(1);
        if (e.key === 'ArrowLeft') step(-1);
      });
      window.galleryStep = step;
    });
  </script>
</body>
</html>
