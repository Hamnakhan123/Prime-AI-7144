<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini cart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
  <main class="container py-4">
    <h1 class="h3 mb-3">🛒 Stationery shop</h1>
    <div class="row g-4">
      <section class="col-lg-7">
        <div id="products" class="row row-cols-1 row-cols-sm-3 g-3">
          <div class="col"><div class="card product h-100" data-name="Notebook" data-price="250"><div class="card-body">
            <h2 class="h6">Notebook</h2><p class="mb-2">Rs 250</p><button class="btn btn-sm btn-primary add">Add</button></div></div></div>
          <div class="col"><div class="card product h-100" data-name="Gel pen" data-price="80"><div class="card-body">
            <h2 class="h6">Gel pen</h2><p class="mb-2">Rs 80</p><button class="btn btn-sm btn-primary add">Add</button></div></div></div>
          <div class="col"><div class="card product h-100" data-name="Geometry box" data-price="650"><div class="card-body">
            <h2 class="h6">Geometry box</h2><p class="mb-2">Rs 650</p><button class="btn btn-sm btn-primary add">Add</button></div></div></div>
        </div>
      </section>
      <aside class="col-lg-5">
        <table id="cart" class="table align-middle">
          <thead><tr><th>Item</th><th>Qty</th><th>Total</th><th></th></tr></thead>
          <tbody></tbody>
          <tfoot><tr><th>Total (<span id="items">0</span> items)</th><th></th><th id="total">Rs 0</th><th></th></tr></tfoot>
        </table>
        <p id="empty" class="text-body-secondary">Your cart is empty.</p>
        <button id="checkout" class="btn btn-success">Checkout</button>
        <button id="clear" class="btn btn-link">Clear cart</button>
      </aside>
    </div>
  </main>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
          integrity="sha384-1H217gwSVyLSIfaLxHbE7dRb3v4mYCKbpQvzx0cegeju1MVsGrX5xXxAvs/HgeFs" crossorigin="anonymous"></script>
  <script src="session-04_cart.js"></script>
</body>
</html>
