<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web quiz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-body-tertiary">
  <main class="container py-4" style="max-width: 680px">
    <h1 class="h3 mb-3">Quick web quiz</h1>
    <form id="quiz">
      <!-- data-answer holds the correct value for each question -->
      <div class="card mb-3 q" data-answer="b"><div class="card-body">
        <p class="fw-semibold">1. How many columns does the Bootstrap grid have?</p>
        <label class="d-block"><input type="radio" name="q1" value="a"> 10</label>
        <label class="d-block"><input type="radio" name="q1" value="b"> 12</label>
        <label class="d-block"><input type="radio" name="q1" value="c"> 16</label></div></div>
      <div class="card mb-3 q" data-answer="a"><div class="card-body">
        <p class="fw-semibold">2. Which symbol is jQuery's short name?</p>
        <label class="d-block"><input type="radio" name="q2" value="a"> $</label>
        <label class="d-block"><input type="radio" name="q2" value="b"> #</label>
        <label class="d-block"><input type="radio" name="q2" value="c"> @</label></div></div>
      <div class="card mb-3 q" data-answer="c"><div class="card-body">
        <p class="fw-semibold">3. Which method attaches an event handler?</p>
        <label class="d-block"><input type="radio" name="q3" value="a"> .attach()</label>
        <label class="d-block"><input type="radio" name="q3" value="b"> .listen()</label>
        <label class="d-block"><input type="radio" name="q3" value="c"> .on()</label></div></div>
      <div class="card mb-3 q" data-answer="b"><div class="card-body">
        <p class="fw-semibold">4. `$('li:even')` starts counting from…</p>
        <label class="d-block"><input type="radio" name="q4" value="a"> 1</label>
        <label class="d-block"><input type="radio" name="q4" value="b"> 0</label></div></div>
      <div class="card mb-3 q" data-answer="a"><div class="card-body">
        <p class="fw-semibold">5. Which breakpoint starts at 768 px?</p>
        <label class="d-block"><input type="radio" name="q5" value="a"> md</label>
        <label class="d-block"><input type="radio" name="q5" value="b"> lg</label></div></div>
      <button type="submit" class="btn btn-primary">Submit</button>
      <button type="button" id="retry" class="btn btn-outline-secondary d-none">Try again</button>
    </form>
    <div id="result" class="alert mt-3 d-none" role="status"></div>
  </main>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
          integrity="sha384-1H217gwSVyLSIfaLxHbE7dRb3v4mYCKbpQvzx0cegeju1MVsGrX5xXxAvs/HgeFs" crossorigin="anonymous"></script>
  <script>
    $(function () {
      const $cards = $('#quiz .q');

      $('#quiz').on('submit', function (e) {
        e.preventDefault();                                     // stay on the page
        let score = 0;
        $cards.each(function (i) {
          const $card = $(this);
          const chosen = $card.find('input:checked').val();     // undefined if nothing picked
          $card.removeClass('border-success border-danger border-warning');
          if (chosen === undefined) {
            $card.addClass('border-warning');                   // unanswered
          } else if (chosen === $card.data('answer')) {
            $card.addClass('border-success'); score++;
          } else {
            $card.addClass('border-danger');
          }
        });
        const pct = Math.round((score / $cards.length) * 100);
        $('#result').removeClass('d-none alert-success alert-danger')
                    .addClass(pct >= 60 ? 'alert-success' : 'alert-danger')
                    .text(`You scored ${score} / ${$cards.length} (${pct}%)`);
        $('#quiz input').prop('disabled', true);
        $('#quiz [type=submit]').prop('disabled', true);
        $('#retry').removeClass('d-none');
      });

      $('#retry').on('click', function () {
        $('#quiz')[0].reset();
        $('#quiz input, #quiz [type=submit]').prop('disabled', false);
        $cards.removeClass('border-success border-danger border-warning');
        $('#result').addClass('d-none');
        $(this).addClass('d-none');
      });
    });
  </script>
</body>
</html>
