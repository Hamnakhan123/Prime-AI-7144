<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order modal – Bootstrap + jQuery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
  <nav class="navbar bg-body-tertiary">
    <div class="container">
      <span class="navbar-brand">🎂 Karachi Bakes</span>
      <span>Cart <span id="cartCount" class="badge text-bg-danger" data-bs-toggle="tooltip" data-bs-title="Items ordered this visit">0</span></span>
    </div>
  </nav>
  <main class="container py-4">
    <div class="row row-cols-1 row-cols-md-3 g-3">
      <div class="col"><div class="card h-100"><div class="card-body">
        <h2 class="h5">Chocolate Fudge</h2><p>Rs 2,400</p>
        <button class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#orderModal" data-cake="Chocolate Fudge" data-price="2400">Order</button>
      </div></div></div>
      <div class="col"><div class="card h-100"><div class="card-body">
        <h2 class="h5">Red Velvet</h2><p>Rs 2,800</p>
        <button class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#orderModal" data-cake="Red Velvet" data-price="2800">Order</button>
      </div></div></div>
      <div class="col"><div class="card h-100"><div class="card-body">
        <h2 class="h5">Lotus Biscoff</h2><p>Rs 3,000</p>
        <button class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#orderModal" data-cake="Lotus Biscoff" data-price="3000">Order</button>
      </div></div></div>
    </div>
  </main>

  <!-- One modal for all cakes -->
  <div class="modal fade" id="orderModal" tabindex="-1" aria-labelledby="orderTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form id="orderForm" class="modal-content" novalidate>
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="orderTitle">Order</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="cakeName"><input type="hidden" id="unitPrice">
          <label for="qty" class="form-label">Quantity (1–10)</label>
          <input id="qty" type="number" class="form-control" min="1" max="10" aria-describedby="qtyError">
          <div id="qtyError" class="invalid-feedback">Choose a whole number from 1 to 10.</div>
          <p class="mt-3 mb-0">Total: <strong id="orderTotal">–</strong></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-danger">Add to order</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast container (bottom-right) -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="orderToast" class="toast" role="status" aria-live="polite" aria-atomic="true">
      <div class="toast-header"><strong class="me-auto">Order updated</strong>
        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button></div>
      <div class="toast-body" id="toastBody"></div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
          integrity="sha384-1H217gwSVyLSIfaLxHbE7dRb3v4mYCKbpQvzx0cegeju1MVsGrX5xXxAvs/HgeFs" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="session-06_order-modal.js"></script>
</body>
</html>
