<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>charLimit plugin demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="container py-4" style="max-width: 600px">
  <h1 class="h3">Post an update</h1>
  <label for="headline" class="form-label">Headline</label>
  <input id="headline" class="form-control">
  <label for="body" class="form-label mt-3">Message</label>
  <textarea id="body" class="form-control" rows="4"></textarea>
  <p class="mt-3">Status: <span id="status">–</span></p>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
          integrity="sha384-1H217gwSVyLSIfaLxHbE7dRb3v4mYCKbpQvzx0cegeju1MVsGrX5xXxAvs/HgeFs" crossorigin="anonymous"></script>
  <script src="session-04_charlimit-plugin.js"></script>
  <script>
    $(function () {
      $('#headline').charLimit({ max: 40, warnAt: 5 });
      $('#body').charLimit({ max: 140, warnAt: 20, format: left => `${left} left` })
                .on('charlimit:update', (e, left) => $('#status').text(left < 0 ? 'too long' : 'ok'))   // chaining works
                .addClass('border-primary');
    });
  </script>
</body>
</html>
