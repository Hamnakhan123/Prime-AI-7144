<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>jQuery to-do list</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-body-tertiary">
  <main class="container py-5" style="max-width: 540px">
    <h1 class="h3 mb-3">✅ My tasks</h1>
    <div class="input-group mb-3">
      <input id="task" class="form-control" placeholder="What needs doing?" aria-label="New task">
      <button id="add" class="btn btn-primary">Add</button>
      <div class="invalid-feedback">Please type a task first.</div>
    </div>
    <ul id="todo-list" class="list-group mb-2"></ul>
    <p id="empty" class="text-body-secondary">No tasks yet – add one above.</p>
    <p id="count" class="small fw-semibold"></p>
  </main>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
          integrity="sha384-1H217gwSVyLSIfaLxHbE7dRb3v4mYCKbpQvzx0cegeju1MVsGrX5xXxAvs/HgeFs" crossorigin="anonymous"></script>
  <script src="session-03_todo.js"></script>
</body>
</html>
