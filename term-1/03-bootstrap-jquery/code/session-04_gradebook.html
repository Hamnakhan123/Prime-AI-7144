<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab gradebook</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
  <main class="container py-4" style="max-width: 820px">
    <h1 class="h3">📒 Lab gradebook – Section B</h1>
    <form id="add-form" class="row g-2 align-items-start mb-3" novalidate>
      <div class="col-sm-6"><input id="name" class="form-control" placeholder="Student name" aria-label="Student name">
        <div class="invalid-feedback">Name is required.</div></div>
      <div class="col-sm-3"><input id="marks" type="number" class="form-control" placeholder="Marks" aria-label="Marks">
        <div class="invalid-feedback">0–100 only.</div></div>
      <div class="col-sm-3"><button class="btn btn-primary w-100">Add student</button></div>
    </form>
    <div class="form-check form-switch mb-2">
      <input class="form-check-input" type="checkbox" id="failOnly"><label class="form-check-label" for="failOnly">Show failing only</label>
    </div>
    <table id="grades" class="table align-middle">
      <thead><tr><th>Name</th><th>Marks</th><th>Result</th><th class="text-end">Actions</th></tr></thead>
      <tbody></tbody>
      <tfoot class="table-light"><tr><th>Average <span id="avg">0.0</span></th><th>Highest <span id="max">–</span></th><th colspan="2">Pass rate <span id="rate">–</span></th></tr></tfoot>
    </table>
  </main>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
          integrity="sha384-1H217gwSVyLSIfaLxHbE7dRb3v4mYCKbpQvzx0cegeju1MVsGrX5xXxAvs/HgeFs" crossorigin="anonymous"></script>
  <script src="session-04_gradebook.js"></script>
</body>
</html>
