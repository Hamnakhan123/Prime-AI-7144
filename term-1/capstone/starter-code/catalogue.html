  <main id="main">

    <section class="container py-5">
      <h1 class="mb-4">Catalogue</h1>
      <!-- Search + filter controls (handled in js/main.js) -->
      <div class="row g-3 align-items-end mb-4">
        <div class="col-12 col-md-6">
          <label for="search" class="form-label">Search</label>
          <input type="search" id="search" class="form-control" placeholder="Type a name…">
        </div>
        <div class="col-12 col-md-6">
          <span class="form-label d-block">Category</span>
          <div id="filters" class="btn-group flex-wrap" role="group" aria-label="Filter by category"></div>
        </div>
      </div>
      <p id="resultCount" class="text-muted" aria-live="polite"></p>
      <div id="catalogue" class="row g-4"></div>
      <p id="noResults" class="alert alert-warning d-none">No items match your search.</p>
    </section>

    <!-- Details modal, filled by js/main.js -->
    <div class="modal fade" id="itemModal" tabindex="-1" aria-labelledby="itemModalTitle" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
        <div class="modal-header"><h2 class="modal-title h5" id="itemModalTitle">Item</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
        <div class="modal-body" id="itemModalBody"></div>
      </div></div>
    </div>
